<link rel="stylesheet" href="style.css?v=20261114-v2-r1">
</head>
<body>
<header class="top">
  <div class="top-l">
    <a class="brand" href="./">知行学录 <span>学生工作台</span></a>
    <span class="crumb" id="crumb"></span>
  </div>
  <div class="top-r">
    <details class="menu" id="libmenu"><summary>资料库</summary>
      <div class="menu-pop">
        <a href="../huaxian/" target="_blank" rel="noopener">划线看组（单独打开）</a>
        <a href="../index.html" target="_blank" rel="noopener">院校与专业组知识库</a>
        <a href="../professional-group-cards/" target="_blank" rel="noopener">2026 专业组卡（可打印）</a>
        <a href="../major-map/" target="_blank" rel="noopener">专业地图</a>
        <a href="../content/index.html" target="_blank" rel="noopener">升学资讯</a>
      </div>
    </details>
    <span class="who" id="who"></span>
    <button type="button" class="btn ghost sm" id="logout" hidden>退出</button>
  </div>
</header>

<main id="view"><p class="loading">正在载入……</p></main>

<div class="modal" id="newm" hidden role="dialog" aria-labelledby="newm-t"><form class="box" id="newform">
  <div class="mh"><h2 id="newm-t">新建学生</h2><button type="button" class="btn ghost sm" data-close="newm">关闭</button></div>
  <div class="mb">
    <label class="f"><span>姓名 / 称呼 *</span><input name="name" required maxlength="40" placeholder="如：张同学"></label>
    <label class="f"><span>家长电话</span><input name="phone" maxlength="30" inputmode="tel"></label>
    <div class="f"><span>科类</span><span class="seg" data-seg="kl"><button type="button" data-v="physics" aria-pressed="true">物理</button><button type="button" data-v="history" aria-pressed="false">历史</button></span></div>
    <div class="f"><span>再选</span><span class="chips" data-chips="subs"></span></div>
    <div class="row2"><label class="f"><span>分数（可空）</span><input name="score" type="number" min="0" max="750" inputmode="numeric"></label><label class="f"><span>位次（可空）</span><input name="rank" type="number" min="1" inputmode="numeric"></label></div>
    <p class="msg" id="newmsg" role="status"></p>
  </div>
  <div class="mf"><button type="submit" class="btn primary">建档</button></div>
</form></div>

<script src="app.js?v=20261114-v2-r1"></script>
</body>
</html>
