<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学生档案库｜江苏招生计划变化知识库</title>
<style>
:root{--green:#0a7c42;--ink:#17211b;--muted:#66756d;--line:#e5ebe7;--bg:#f6f8f7;--red:#b42318;--redbg:#fff0ee;--shadow:0 14px 40px rgba(11,42,26,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:10;background:rgba(246,248,247,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 24px}
h1{margin:0;font-size:24px;letter-spacing:0}.subtitle{margin:5px 0 0;color:var(--muted);font-size:13px}
.hero-actions,.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill-btn,.actions button,.upload-box button,.file-actions button{height:34px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 13px;font-size:12px;font-weight:900;color:#26372d;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;line-height:1}
.pill-btn.save,.actions .save,.upload-box .save{background:var(--green);border-color:var(--green);color:#fff}.danger{border-color:#f1c8c2!important;background:#fff8f7!important;color:var(--red)!important}
.page{padding:18px 24px 36px;display:grid;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head h2{margin:0;font-size:17px}.panel-body{padding:14px 16px}
.profile-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.profile-title{border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#f7fffa,#fff);padding:16px}.profile-title h2{margin:0;font-size:28px;letter-spacing:0}.profile-title p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.65}.student-no{display:inline-flex;vertical-align:middle;margin-left:7px;border:1px solid #d8e6dc;border-radius:999px;background:#f7faf8;color:#526058;padding:3px 8px;font-size:11px;font-weight:900;letter-spacing:.02em}
.meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.meta-card,.stat-card{border:1px solid #edf3ef;border-radius:12px;background:#fff;padding:10px}.meta-card b,.stat-card b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.meta-card span,.stat-card span{font-size:13px;font-weight:900;color:#24352b;word-break:break-word}
.section-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.stat-card span{font-size:20px;color:var(--green)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}.kv-grid{display:grid;grid-template-columns:130px minmax(0,1fr);gap:0 12px}.kv-grid div{display:contents}.kv-grid b,.kv-grid span{border-top:1px solid #eef3ef;padding:9px 0}.kv-grid div:first-child b,.kv-grid div:first-child span{border-top:0}.kv-grid b{color:var(--muted);font-size:12px}.kv-grid span{font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.upload-box{display:grid;grid-template-columns:160px minmax(150px,1fr) minmax(180px,1.2fr) auto;gap:9px;align-items:end}.upload-box label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:900}.upload-box input,.upload-box select{height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;min-width:0}
.sections{display:grid;gap:12px}.section-panel{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fbfdfc;border-bottom:1px solid var(--line);padding:12px 14px}.section-head h3{margin:0;font-size:15px}.badge{display:inline-flex;align-items:center;justify-content:center;border:1px solid #cbeed9;border-radius:999px;background:#eaf7ef;color:var(--green);padding:4px 8px;font-size:11px;font-weight:900;line-height:1;white-space:nowrap}
.file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid #f0f4f1}.file-row:first-child{border-top:0}.file-row b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-row p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.file-actions{display:flex;gap:6px;white-space:nowrap}
.form-list{display:grid;gap:8px}.form-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #edf3ef;border-radius:12px;background:#fbfdfc;padding:10px}.form-row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.form-row p{margin:4px 0 0;color:var(--muted);font-size:12px}
.empty{border:1px dashed #b7dfc6;border-radius:14px;background:#fbfffc;color:var(--muted);padding:18px;text-align:center;line-height:1.7}.notice{border:1px solid #fed7aa;border-radius:14px;background:#fff7ed;color:#7c2d12;padding:12px;line-height:1.65}
@media(max-width:980px){.profile-hero,.two-col{grid-template-columns:1fr}.section-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.upload-box{grid-template-columns:1fr 1fr}.upload-box button{width:100%}}
@media(max-width:620px){.hero{display:block}.hero-actions{justify-content:flex-start;margin-top:12px}.page{padding:12px}.meta-grid,.section-stats,.upload-box,.file-row,.form-row,.kv-grid{grid-template-columns:1fr}.file-actions{flex-wrap:wrap}.profile-title h2{font-size:23px}}
</style>
</head>

</html>
