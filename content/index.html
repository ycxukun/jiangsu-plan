<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>升学规划资讯中心｜知行学录</title>
<style>
:root{--brand:rgb(10,124,66);--brand-dark:#075b32;--bg:#f6f8f7;--card:#fff;--ink:#17231c;--muted:#647067;--line:rgba(23,35,28,.10);--red:#d92d20;--blue:#2563eb;--shadow:0 10px 28px rgba(11,42,26,.07)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,248,247,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.hero{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 28px}
.brand h1{margin:0;font-size:24px;letter-spacing:-.03em}
.brand p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pill,.btn{height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line);background:#fff;color:#24352b;text-decoration:none;padding:0 12px;font-size:12px;font-weight:850;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.pill.green{background:#eaf7ef;color:var(--brand);border-color:#cbeed9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.blue{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.wrap{width:min(1480px,calc(100% - 40px));margin:0 auto;padding:16px 0 36px}
.module-strip{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.module-card{min-height:74px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;text-align:left;color:inherit;box-shadow:0 1px 0 rgba(0,0,0,.03);transition:.16s ease}
.module-card:hover{border-color:#9bd8b2;box-shadow:var(--shadow);transform:translateY(-1px)}
.module-card.active{border-color:var(--brand);background:#effaf3;box-shadow:0 0 0 3px rgba(10,124,66,.08)}
.module-card b{display:block;font-size:15px;line-height:1.2;margin-bottom:8px}
.module-card span{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;line-height:1.25}
.module-card em{font-style:normal;color:var(--brand);font-weight:900}
.content-tabs{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.content-tab{height:38px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#24352b;padding:0 16px;font-size:13px;font-weight:900;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.content-tab.active{background:#111;color:#fff;border-color:#111}
.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) 150px 110px 116px;gap:8px;margin-bottom:10px}
.toolbar input,.toolbar select{height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;color:var(--ink)}
.upload-row{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;margin-bottom:12px;box-shadow:0 6px 18px rgba(11,42,26,.04)}
.upload-row.open{display:block}
.login-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.login-box input{height:34px;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:0 9px}
.form{display:grid;grid-template-columns:1.15fr 150px minmax(180px,.8fr) minmax(220px,1fr) 150px;gap:8px;align-items:end}
.form label{display:grid;gap:5px;font-size:12px;font-weight:850;color:#405047}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;color:var(--ink)}
.form textarea{height:36px;min-height:36px;resize:vertical}
.progress{height:6px;background:#edf2ef;border-radius:99px;overflow:hidden;grid-column:1/-1}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#30b66d);transition:.2s ease}
.status{font-size:12px;color:var(--muted);line-height:1.5}
.danger{color:var(--red)}
.notice{border:1px solid #fed7aa;background:#fff7ed;color:#7c2d12;border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.55;margin-bottom:10px}
.content-shell{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
.content-shell.posts-mode{grid-template-columns:1fr}
.content-shell.posts-mode .viewer{display:none}
.list-panel,.viewer{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 22px rgba(11,42,26,.05);overflow:hidden}
.list-head{height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:0 14px}
.list-head h2{margin:0;font-size:16px}
.list-head span{font-size:12px;color:var(--muted);font-weight:850}
.article-list{display:grid}
.article-list.posts{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px;background:#fbfcfb}
.article-list.posts .notice,.article-list.posts .empty{grid-column:1/-1}
.post-card{min-height:250px;border:1px solid var(--line);border-radius:14px;background:#fff;color:inherit;text-decoration:none;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 18px rgba(11,42,26,.04);transition:.16s ease}
.post-card:hover{border-color:#9bd8b2;box-shadow:var(--shadow);transform:translateY(-1px)}
.post-cover{height:132px;background:linear-gradient(135deg,#eaf7ef,#fff7e8);display:grid;place-items:center;color:#8b7a69;font-weight:900;font-size:13px;overflow:hidden}
.post-cover img{width:100%;height:100%;object-fit:cover;display:block}
.post-info{display:grid;gap:8px;padding:12px}
.post-info h3{margin:0;font-size:17px;line-height:1.25;letter-spacing:-.03em}
.post-info p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.post-tag{border:1px solid #e6d8c8;background:#fff7ea;border-radius:999px;padding:3px 8px;color:#7b4b2d;font-weight:850}
.post-card-actions{margin-top:auto;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:0 12px 12px}
.post-card-actions .btn{height:30px}
.content-row{display:grid;grid-template-columns:minmax(0,1fr) 138px auto;gap:12px;align-items:center;min-height:44px;border-bottom:1px solid var(--line);padding:0 14px;color:inherit;text-decoration:none;background:#fff}
.content-row:hover{background:#f8fbf9}
.content-row:last-child{border-bottom:0}
.content-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:850}
.content-open{min-width:0;border:0;background:transparent;color:inherit;text-align:left;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:850}
.delete-file-btn{height:28px;border-radius:999px;border:1px solid #fecaca;background:#fff;color:#b42318;padding:0 10px;font-size:12px;font-weight:850}
.delete-file-btn:hover{background:#fff1f2}
.content-time{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.viewer{position:sticky;top:86px}
.viewer-head{height:42px;padding:0 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.viewer-head h3{margin:0;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-body{height:500px;background:#f8faf9}
.viewer iframe{width:100%;height:100%;border:0;background:#fff}
.media-preview{height:100%;display:grid;place-items:center;padding:12px;background:#f8faf9}
.media-preview img,.media-preview video{max-width:100%;max-height:100%;border-radius:8px}
.media-preview audio{width:min(320px,100%)}
.text-preview{height:100%;margin:0;overflow:auto;white-space:pre-wrap;padding:14px;font-size:12px;line-height:1.6;background:#fff}
.viewer .empty{height:500px;display:grid;place-items:center;padding:24px}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 0 0}
.hidden{display:none!important}
@media(max-width:1180px){.module-strip{grid-template-columns:repeat(4,minmax(120px,1fr))}.content-shell{grid-template-columns:1fr}.viewer{position:relative;top:0}.form{grid-template-columns:1fr 1fr}.form .btn,.progress{grid-column:1/-1}.article-list.posts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.hero{display:grid;padding:14px 16px}.actions{justify-content:flex-start}.wrap{width:min(100% - 20px,720px)}.module-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr}.content-row{grid-template-columns:1fr;gap:5px;padding:9px 12px}.content-time{text-align:left}.delete-file-btn{justify-self:start}.form{grid-template-columns:1fr}.article-list.posts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="hero">
    <div class="brand"><h1>升学规划资讯中心</h1><p>图文文章与文件资料并存；规划师可在线写文章、发布政策解读和院校研究。</p></div>
    <div class="actions">
      <a class="pill" href="../index.html">返回志愿填报</a>
      <a class="pill" href="../specialty/index.html">专科系统</a>
      <a class="pill" href="../major-map/">专业地图</a>
      <span id="accountPill" class="pill green">未登录</span>
      <a id="loginEntryBtn" class="pill" href="../login_landing.html?next=./content/index.html#login">登录入口</a>
      <a id="writePostBtn" class="btn primary hidden" href="./editor.html">写文章</a>
      <button id="toggleUploadBtn" class="btn primary hidden" type="button">上传资料</button>
      <button id="logoutBtn" class="btn hidden" type="button">退出</button>
    </div>
  </div>
</header>
<main class="wrap">
  <nav id="moduleStrip" class="module-strip" aria-label="升学资讯模块"></nav>

  <section class="content-tabs" aria-label="内容类型">
    <button id="postsTab" class="content-tab active" type="button">图文文章</button>
    <button id="filesTab" class="content-tab" type="button">资料文件</button>
  </section>

  <section class="toolbar" aria-label="资讯筛选">
    <input id="searchInput" placeholder="搜索名称，例如：中外合作 / 综评 / 专业" />
    <select id="categoryFilter"><option value="">全部模块</option><option>中外合作</option><option>志愿填报</option><option>政策解读</option><option>院校研究</option><option>专业研究</option><option>提前批</option><option>讲座资料</option><option>表格数据</option><option>图片资料</option><option>其他文件</option></select>
    <button id="refreshBtn" class="btn" type="button">刷新</button>
    <button id="clearFilterBtn" class="btn" type="button">全部</button>
  </section>

  <section id="uploadRow" class="upload-row">
    <div id="loginArea" class="login-box"></div>
    <form id="uploadForm" class="form">
      <label>资料名称<input id="titleInput" required placeholder="例如：2026 江苏综评政策时间线"></label>
      <label>所属模块<select id="categoryInput"><option>中外合作</option><option>志愿填报</option><option>政策解读</option><option>院校研究</option><option>专业研究</option><option>提前批</option><option>讲座资料</option><option>表格数据</option><option>图片资料</option><option>其他文件</option></select></label>
      <label>简单备注<textarea id="summaryInput" placeholder="可空"></textarea></label>
      <label>资料文件<input id="fileInput" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.txt,.md,.jpg,.jpeg,.png,.webp,.gif,.zip,.rar,.7z,application/pdf,image/*,text/*" required></label>
      <button id="uploadBtn" class="btn primary" type="submit">上传并发布</button>
      <div class="progress" aria-label="上传进度"><i id="progressBar"></i></div>
      <div id="uploadStatus" class="status"></div>
    </form>
  </section>

  <section id="contentShell" class="content-shell posts-mode">
    <section class="list-panel">
      <div class="list-head"><h2 id="sectionTitle">全部模块</h2><span id="sectionCount">0 条</span></div>
      <div id="articleList" class="article-list"></div>
    </section>
    <aside class="viewer">
      <div class="viewer-head"><h3 id="viewerTitle">文件预览</h3><a id="openPdfLink" class="btn blue hidden" href="#" target="_blank" rel="noopener">打开</a></div>
      <div class="viewer-body" id="viewerBody"><div class="empty">选择左侧文件查看。</div></div>
    </aside>
  </section>
  <div class="footer">© 2026 知行学录 · 升学资讯中心</div>
</main>
<script src="./app.js?v=20260705-post-mvp-r1"></script>
</body>
</html>
