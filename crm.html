<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>志愿填报服务 CRM｜知行学录</title>
<style>
:root{--green:#0a7c42;--green2:#075b32;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f7fa;--card:#fff;--red:#dc2626;--orange:#f97316;--yellow:#f59e0b;--blue:#2563eb;--purple:#7c3aed;--shadow:0 14px 36px rgba(15,23,42,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#0f2419;color:#e8f5ee;padding:18px 14px;border-right:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#16a34a,#0a7c42);display:grid;place-items:center;font-weight:1000}.brand b{display:block;font-size:16px}.brand span{display:block;color:#a9c7b8;font-size:12px;margin-top:3px}
.nav{display:grid;gap:6px}.nav button{height:42px;border:0;border-radius:12px;background:transparent;color:#d8eee3;text-align:left;padding:0 12px;font-weight:900}.nav button:hover,.nav button.active{background:rgba(255,255,255,.1);color:#fff}.nav small{display:block;color:#8bb29d;font-size:11px;font-weight:700;margin-top:2px}
.side-foot{margin-top:18px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.06);font-size:12px;line-height:1.7;color:#cfe9dc}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,250,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.title h1{margin:0;font-size:22px}.title p{margin:4px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn,.actions a{height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#26352d;padding:0 13px;font-size:13px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{border-color:#fecaca;background:#fff7f7;color:var(--red)}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
.page{padding:18px 22px 36px;display:grid;gap:16px}.notice{border:1px solid #fed7aa;border-radius:14px;background:#fff7ed;color:#7c2d12;padding:12px 14px;line-height:1.6}
.grid{display:grid;gap:14px}.kpi-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.kpi b{font-size:28px}.kpi span{display:block;margin-top:6px;color:var(--muted);font-size:12px}.kpi.red{border-color:#fecaca;background:#fffafa}.kpi.orange{border-color:#fed7aa;background:#fffaf3}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{margin:0;font-size:17px}.panel-body{padding:14px 16px}
.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) 180px 180px 140px auto;gap:10px}.toolbar input,.toolbar select,.form-grid input,.form-grid select,.form-grid textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 11px;min-width:0}.toolbar input,.toolbar select,.form-grid input,.form-grid select{height:38px}.form-grid textarea{padding:10px;min-height:82px;resize:vertical}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:10px 12px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc;color:#64748b;font-size:12px;white-space:nowrap}tr:hover td{background:#fbfdfc}.link-btn{border:0;background:transparent;color:var(--green);font-weight:900;padding:0}
.badge{display:inline-flex;align-items:center;border:1px solid #dbe7df;border-radius:999px;background:#fff;padding:4px 8px;font-size:11px;font-weight:900;white-space:nowrap;color:#475569}.badge.green{border-color:#bbf7d0;background:#f0fdf4;color:#15803d}.badge.red{border-color:#fecaca;background:#fef2f2;color:#b91c1c}.badge.orange{border-color:#fed7aa;background:#fff7ed;color:#c2410c}.badge.yellow{border-color:#fde68a;background:#fffbeb;color:#a16207}.badge.blue{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8}.badge.purple{border-color:#ddd6fe;background:#f5f3ff;color:#6d28d9}
.board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:12px;overflow:auto;padding-bottom:4px}.lane{min-width:260px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;overflow:hidden}.lane-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);font-weight:1000}.cards{display:grid;gap:10px;padding:10px;min-height:120px}.case-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;box-shadow:0 8px 20px rgba(15,23,42,.05)}.case-card.high{border-color:#fed7aa}.case-card.severe{border-color:#fecaca;background:#fffafa}.case-card h3{margin:0;font-size:15px}.case-card p{margin:6px 0 0;color:#64748b;font-size:12px;line-height:1.5}.case-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.case-actions .btn{height:30px;font-size:12px;padding:0 9px}
.detail{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px}.profile{display:grid;gap:10px}.profile-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px}.profile-card h3{margin:0;font-size:20px}.profile-card p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.complete{height:10px;border-radius:999px;background:#e5e7eb;overflow:hidden}.complete i{display:block;height:100%;background:var(--green);width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{height:34px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 12px;font-size:12px;font-weight:900}.tabs button.active{background:#111827;color:#fff;border-color:#111827}.record-list{display:grid;gap:10px}.record{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.record h4{margin:0;font-size:14px}.record p{margin:6px 0 0;color:#64748b;font-size:12px;line-height:1.6;white-space:pre-wrap}.record-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:80}.modal-mask.open{display:flex}.modal{width:min(920px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:0 32px 120px rgba(15,23,42,.28)}.modal h2{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:18px}.modal-body{padding:16px 18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid label{display:grid;gap:5px;color:#64748b;font-size:12px;font-weight:900}.form-grid .wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.choice-field{display:grid;gap:6px;color:#64748b;font-size:12px;font-weight:900}.choice-pills{display:flex;gap:8px;flex-wrap:wrap}.choice-pills label{display:inline-flex!important;gap:0!important}.choice-pills input{position:absolute;opacity:0;pointer-events:none}.choice-pills span{display:inline-flex;align-items:center;justify-content:center;height:38px;min-width:76px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#334155;font-weight:1000}.choice-pills input:checked+span{border-color:#86efac;background:#ecfdf5;color:#08703a;box-shadow:inset 0 0 0 1px #86efac}.choice-field small{font-size:11px;color:#94a3b8;font-weight:700;line-height:1.4}
.empty{border:1px dashed #cbd5e1;border-radius:14px;background:#fbfdff;color:#64748b;text-align:center;padding:18px;line-height:1.7}.hidden{display:none!important}
@media(max-width:1280px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(2,minmax(260px,1fr))}.toolbar{grid-template-columns:1fr 1fr 1fr}.toolbar input{grid-column:1/-1}.detail{grid-template-columns:1fr}}
@media(max-width:860px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.nav{grid-template-columns:repeat(2,1fr)}.topbar{display:block}.actions{justify-content:flex-start;margin-top:12px}.kpi-grid,.board,.form-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.page{padding:12px}.modal{width:100%}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="mark">CRM</div><div><b>志愿填报服务</b><span>客户 · 订单 · 服务交付</span></div></div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active">首页仪表盘<small>经营、进度、风险</small></button>
      <button data-view="orders">客户与订单<small>收单、付款、建档</small></button>
      <button data-view="students">学生档案<small>资料完整度、对接填报</small></button>
      <button data-view="board">服务看板<small>分配、状态流转</small></button>
      <button data-view="tasks">任务中心<small>待办、超时、完成</small></button>
      <button data-view="risks">风险中心<small>风险提示与确认</small></button>
      <button data-view="plans">方案与附件<small>版本、复核、锁定</small></button>
      <button data-view="audit">操作日志<small>关键动作留痕</small></button>
    </nav>
    <div class="side-foot">
      <b>权限边界</b><br>
      管理员/主管看全部；销售看本人客户订单；规划师看被分配学生；关键动作写入 CRM 日志。
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="title"><h1 id="pageTitle">首页仪表盘</h1><p id="pageSub">正在载入业务数据...</p></div>
      <div class="actions">
        <a class="btn" href="./index.html">本科系统</a>
        <a class="btn" href="./specialty/index.html">专科系统</a>
        <a class="btn" href="./students/index.html">学生档案</a>
        <a class="btn" href="./admin-console.html">管理员后台</a>
        <button class="btn primary" id="quickOrderBtn" type="button">新建收单</button>
        <button class="btn" id="refreshBtn" type="button">刷新</button>
      </div>
    </header>
    <section class="page">
      <div id="notice" class="notice">正在检查登录状态...</div>
      <section class="toolbar panel">
        <input id="globalSearch" type="search" placeholder="搜索学生、家长、手机号、微信、订单号、规划师">
        <select id="statusFilter"><option value="">全部服务状态</option></select>
        <select id="ownerFilter"><option value="">全部负责人</option></select>
        <select id="riskFilter"><option value="">全部风险</option><option>低</option><option>中</option><option>高</option><option>严重</option></select>
        <button class="btn" id="clearFilterBtn" type="button">清空</button>
      </section>
      <div id="view"></div>
    </section>
  </main>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h2 id="modalTitle">弹窗</h2>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="./crm.js?v=20260710-security-integrity-r1"></script>
</body>
</html>
