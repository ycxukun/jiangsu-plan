<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>招办谈判策略</title>
    <style>
      body {
        margin: 0;
        background: #f5f7f6;
        color: #17201b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 820px;
        margin: 0 auto;
        padding: 42px 20px 72px;
      }

      a {
        color: #08743d;
      }

      article {
        border: 1px solid #dce4df;
        border-radius: 8px;
        background: #fff;
        padding: 28px;
        box-shadow: 0 16px 40px rgba(24, 43, 33, 0.08);
      }

      h1 {
        margin: 10px 0 18px;
        font-size: clamp(30px, 4vw, 44px);
        line-height: 1.16;
      }

      ol {
        margin: 20px 0 0;
        padding-left: 24px;
      }

      li {
        margin: 14px 0;
        color: #3f4f47;
        line-height: 1.85;
        font-size: 17px;
      }

      .meta {
        color: #08743d;
        font-size: 14px;
        font-weight: 800;
      }

      .back {
        display: inline-flex;
        margin-bottom: 16px;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/">返回升学规划首页</a>
      <article>
        <div class="meta">本科招生资讯 · 填报策略 · 2026-07-03</div>
        <h1>招办谈判策略</h1>
        <ol>
          <li>确保是学校招生负责人或者招生老师，必须是学校在职在岗的教师；</li>
          <li>和招生老师线下签署纸质协议，注意保留录音录像证据；</li>
          <li>保持联系，确保招生老师已经将协议反馈到招生办并生效；</li>
          <li>询问政策是否有更新，确保志愿填报结束之前协议有效。</li>
        </ol>
      </article>
    </main>
  </body>
</html>
