<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理员后台｜好生涯规划系统</title>
<style>
:root{--green:#0a7c42;--ink:#17211b;--muted:#66756d;--line:#e5ebe7;--bg:#f6f8f7;--red:#b42318;--redbg:#fff0ee;--shadow:0 14px 40px rgba(11,42,26,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:10;background:rgba(246,248,247,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.hero{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:18px 24px}
h1{margin:0;font-size:24px}.subtitle{margin:5px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{height:34px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 13px;font-size:12px;font-weight:900;color:#26372d;text-decoration:none;display:inline-flex;align-items:center}.pill.save{background:var(--green);border-color:var(--green);color:#fff}.pill.danger{border-color:#f1c8c2;background:#fff8f7;color:var(--red)}
.page{padding:18px 24px 34px;display:grid;gap:14px}
.notice{border:1px solid #fed7aa;border-radius:14px;background:#fff7ed;color:#7c2d12;padding:12px;line-height:1.65}
.grid{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel-head h2{margin:0;font-size:17px}.panel-body{padding:14px 16px}
.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 160px 140px auto;gap:10px}
input,select{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;min-width:0}
button{height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font-size:12px;font-weight:900;color:#24352b}
button.save{background:var(--green);border-color:var(--green);color:#fff}button.danger{border-color:#f1c8c2;background:#fff8f7;color:var(--red)}
.planner-list,.student-list{display:grid;gap:10px}
.planner-card,.student-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px}
.planner-card{cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
.planner-card:hover,.planner-card:focus-visible{border-color:#9fd8b7;background:#fbfffc;box-shadow:0 0 0 3px rgba(10,124,66,.08);outline:none}
.planner-card.selected{border-color:var(--green);background:#f0faf4;box-shadow:0 0 0 1px rgba(10,124,66,.18),var(--shadow)}
.planner-card.disabled{opacity:.62;background:#fafafa}.planner-card h3,.student-card h3{margin:0;font-size:15px}
.planner-card p,.student-card p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.badge{display:inline-flex;align-items:center;justify-content:center;border:1px solid #cbeed9;border-radius:999px;background:#eaf7ef;color:var(--green);padding:4px 8px;font-size:11px;font-weight:900;line-height:1;white-space:nowrap}
.student-no{display:inline-flex;margin-left:6px;border:1px solid #d8e6dc;border-radius:999px;background:#f7faf8;color:#526058;padding:2px 7px;font-size:11px;font-weight:900}
.row-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.transfer-row{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:8px;margin-top:10px}
.form-grid{display:grid;grid-template-columns:1fr;gap:9px}.form-grid label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:900}
.admin-help{border:1px solid #cbeed9;border-radius:12px;background:#f0faf4;color:#24533a;padding:10px 12px;font-size:12px;line-height:1.65}
.empty{border:1px dashed #b7dfc6;border-radius:14px;background:#fbfffc;color:var(--muted);padding:18px;text-align:center;line-height:1.7}
@media(max-width:960px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.hero{display:block}.actions{margin-top:12px}}
@media(max-width:560px){.page{padding:12px}.toolbar,.transfer-row{grid-template-columns:1fr}.hero{padding:14px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="hero">
    <div>
      <h1>管理员后台</h1>
      <p class="subtitle">管理规划师、学生归属、学生删除/恢复和好生涯学号。</p>
    </div>
    <div class="actions">
      <a class="pill" href="./index.html">返回本科系统</a>
      <a class="pill" href="./crm.html">CRM 工作台</a>
      <a class="pill" href="./students/index.html">学生档案</a>
      <button class="pill save" id="refreshBtn" type="button">刷新</button>
    </div>
  </div>
</header>
<main class="page">
  <section id="notice" class="notice">正在检查管理员权限...</section>
  <section class="toolbar panel">
    <input id="searchInput" type="search" placeholder="搜索学生姓名、HSY学号、手机号、规划师邮箱">
    <select id="plannerFilter"><option value="">全部规划师</option></select>
    <select id="archivedFilter"><option value="active">未删除学生</option><option value="archived">已删除学生</option><option value="all">全部学生</option></select>
    <button id="clearBtn" type="button">清空</button>
  </section>
  <div class="grid">
    <section class="panel">
      <div class="panel-head"><h2>人员/规划师管理</h2><span class="badge" id="plannerCount">0 人</span></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="admin-help">账号流程：内测阶段允许邮箱密码自由注册。对方注册一次后会自动成为 active 规划师；这里主要用于按邮箱补授权、改角色、禁用账号和查看该规划师名下学生。</div>
          <label>邮箱<input id="plannerEmail" placeholder="规划师登录邮箱，例如 planner@example.com"></label>
          <label>用户 UUID（可选）<input id="plannerUserId" placeholder="一般不用填；系统会按邮箱查账号"></label>
          <label>显示名<input id="plannerName" placeholder="规划师姓名，可空"></label>
          <button class="save" id="addPlannerBtn" type="button">补授权/启用规划师</button>
        </div>
        <div id="plannerList" class="planner-list" style="margin-top:12px"></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 id="studentAssignmentTitle">学生分配管理</h2><span class="badge" id="studentCount">0 人</span></div>
      <div class="panel-body"><div id="studentList" class="student-list"></div></div>
    </section>
  </div>
</main>
<script src="./admin-console.js?v=20260706-open-signup-r2"></script>
</body>
</html>
