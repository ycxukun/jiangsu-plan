name: Site maintenance (Supabase keep-alive + HTTPS certificate)

# 1) Supabase 免费项目连续 7 天没有数据库访问就会被自动暂停。
#    这里每 3 天查询一次数据库，保持项目活跃。
#    注意：已经被暂停的项目，需要先到 Supabase 控制台手动点 Restore，这个任务只能防止“再次”暂停。
# 2) Let's Encrypt 证书 90 天到期。这里每周通过 SSH 在服务器上执行一次 certbot renew，
#    快到期（30 天内）时才会真正续期，续期后自动重载 Nginx。
# 也可以在 GitHub 的 Actions 页面手动点 “Run workflow” 立即执行。

on:
  schedule:
    - cron: '23 1 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: https://qnspmqsrbjcgrgpqkzgl.supabase.co
          SUPABASE_KEY: sb_publishable_pVjv5t2S338SsCW98VvwpA_PcpXBL7V
        run: |
          set -uo pipefail
          code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 60 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/volunteer_forms?select=id&limit=1")
          echo "HTTP $code"
          head -c 300 body.txt; echo
          if [ "$code" = "000" ] || [ "$code" -ge 500 ] || [ "$code" = "404" ]; then
            echo "::error::Supabase 没有响应（HTTP $code）。项目可能已被暂停：请登录 supabase.com 控制台，打开项目后点 Restore project。"
            exit 1
          fi
          echo "Supabase 正常响应，项目保持活跃。"

  https-certificate:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          test -n "${{ secrets.ECS_HOST }}"
          test -n "${{ secrets.ECS_USER }}"
          test -n "${{ secrets.ECS_SSH_PRIVATE_KEY }}"

      - name: Configure SSH
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Renew certificate on server
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aliyun_deploy_key "$ECS_USER@$ECS_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo -n"
          echo "== 续期前 =="
          $SUDO certbot certificates 2>&1 | grep -E "Certificate Name|Domains|Expiry" || true
          echo "== 执行续期 =="
          $SUDO certbot renew --non-interactive --deploy-hook "systemctl reload nginx" 2>&1 | tail -n 30
          rc=${PIPESTATUS[0]}
          echo "== 续期后 =="
          $SUDO certbot certificates 2>&1 | grep -E "Certificate Name|Domains|Expiry" || true
          # 打开系统自带的自动续期定时器（如果有），以后不靠这个任务也能续期
          $SUDO systemctl enable --now certbot.timer 2>/dev/null || $SUDO systemctl enable --now snap.certbot.renew.timer 2>/dev/null || true
          $SUDO nginx -t && $SUDO systemctl reload nginx
          exit $rc
          REMOTE
