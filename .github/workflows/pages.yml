name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check students/app.js
          node --check specialty/app.js
          node --check content/app.js
          node --check content/editor.js
          node --check content/article.js

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp .nojekyll index.html admin.html app.js haoshengya_login_landing.html _site/
          cp style-claude-*.css _site/
          cp data*.js _site/
          cp school-life-info-data.js _site/
          cp -R articles content students specialty _site/
          if [ -f _redirects ]; then
            cp _redirects _site/
          fi

          test -f _site/index.html
          test -f _site/app.js
          test -f _site/style-claude-clean.css
          test -f _site/style-claude-inspired.css
          test -f _site/style-claude-force.css
          test -f _site/style-claude-typography.css
          test -f _site/data-db.js
          test -f _site/data-major-details.js
          test -f _site/data-foreign-coop-details.js
          test -d _site/content
          test -d _site/students
          test -d _site/specialty

          find _site -name '.DS_Store' -delete
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment1.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying Pages deployment
        if: steps.deployment1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before final Pages deployment retry
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Fail after Pages deployment retries
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure' && steps.deployment3.outcome == 'failure'
        run: exit 1
